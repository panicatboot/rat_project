[project]
name = "rat-project"
version = "0.1.0"
description = ""
authors = [
    {name = "panicatboot", email = "100204853+panicatboot@users.noreply.github.com"}, {name = "nassima03", email = "nassimabouaraba03@gmail.com"}
]
requires-python = ">=3.13"
dependencies = ["cryptography (>=46.0.5,<47.0.0)", "pipwin (>=0.5.2,<0.6.0)", "sounddevice (>=0.5.5,<0.6.0)", "opencv-python (>=4.0.0,<5.0.0)", "pynput (>=1.7.0,<2.0.0)", "mss (>=9.0.0,<10.0.0)"]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
